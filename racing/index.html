<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Highway Racer - Inorya</title>
    <style>
        * { user-select: none; touch-action: manipulation; }
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(180deg, #0a0f1e 0%, #0f1a2e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
        }
        .game-container {
            background: #0a0a1a;
            padding: 15px;
            border-radius: 20px;
            border: 2px solid #0ff;
            box-shadow: 0 0 20px rgba(0,255,255,0.3);
        }
        canvas { display: block; margin: 0 auto; border-radius: 10px; background: #151525; }
        .info { text-align: center; margin-top: 10px; color: #0ff; font-size: 13px; }
        .speed-panel { text-align: center; color: #ff0; font-size: 22px; font-weight: bold; margin-bottom: 10px; }
        .controls { display: flex; justify-content: center; gap: 20px; margin-top: 15px; }
        button {
            background: linear-gradient(145deg, #1a1a2e, #0a0a1a);
            border: 1px solid #0ff;
            color: #0ff;
            font-size: 24px;
            font-weight: bold;
            padding: 10px 28px;
            border-radius: 50px;
            cursor: pointer;
            font-family: monospace;
            box-shadow: 0 4px 0 #004466;
            transition: 0.03s linear;
        }
        button:active { transform: translateY(3px); }
        .key-hint { text-align: center; margin-top: 10px; font-size: 10px; color: #888; }
        .back-home { text-align: center; margin-top: 15px; }
        .back-home a { color: cyan; text-decoration: none; font-size: 14px; background: #00000066; padding: 5px 15px; border-radius: 20px; display: inline-block; }
        .back-home a:hover { background: cyan; color: black; }
    </style>
</head>
<body>
<div>
    <div class="game-container">
        <div class="speed-panel">⚡ SPEED: <span id="speedVal">0</span> KM/H ⚡</div>
        <canvas id="gameCanvas" width="400" height="550"></canvas>
        <div class="controls">
            <button id="leftBtn">◀ KIRI</button>
            <button id="rightBtn">KANAN ▶</button>
        </div>
        <div class="key-hint">⌨️ ← → atau A D | 📱 TEKAN TOMBOL</div>
        <div class="info">🚗 Hindari mobil lain! 🚗</div>
        <div class="back-home"><a href="../index.html">🏠 KEMBALI KE HOME</a></div>
    </div>
</div>

<script>
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 400;
        canvas.height = 550;
        
        let playerX = canvas.width / 2 - 23;
        const playerWidth = 46, playerHeight = 56, playerY = canvas.height - 80;
        let enemies = [];
        let score = 0;
        let baseSpeed = 3.8;
        let gameRunning = true;
        let spawnDelay = 0;
        let leftPressed = false, rightPressed = false;
        
        const enemyColors = ['#e74c3c', '#3498db', '#9b59b6', '#e67e22', '#f1c40f', '#2ecc71', '#e91e63'];
        
        function saveHighScore(score) {
            let best = localStorage.getItem('racing_best') || 0;
            if(score > best) {
                localStorage.setItem('racing_best', score);
                localStorage.setItem('racing_highscore', score);
            }
        }
        
        function canSpawnAt(x, y) {
            for(let e of enemies) {
                if(Math.abs(e.x - x) < 42 && Math.abs(e.y - y) < 55) return false;
                if(Math.abs(e.y - y) < 70 && Math.abs(e.x - x) < 45) return false;
            }
            return true;
        }
        
        function spawnEnemy() {
            if(!gameRunning) return;
            let attempts = 0;
            while(attempts < 15) {
                const randX = 12 + Math.random() * (canvas.width - 52);
                const randY = -60 - Math.random() * 80;
                if(canSpawnAt(randX, randY)) {
                    enemies.push({ x: randX, y: randY, width: 42, height: 52, color: enemyColors[Math.floor(Math.random() * enemyColors.length)] });
                    return;
                }
                attempts++;
            }
            enemies.push({ x: 15 + Math.random() * (canvas.width - 57), y: -60, width: 42, height: 52, color: enemyColors[Math.floor(Math.random() * enemyColors.length)] });
        }
        
        for(let i = 0; i < 2; i++) { spawnEnemy(); if(enemies[i]) enemies[i].y = -100 - i * 150; }
        
        function updateGame() {
            if(!gameRunning) return;
            baseSpeed += 0.0025;
            if(baseSpeed > 8.5) baseSpeed = 8.5;
            document.getElementById('speedVal').innerText = Math.floor(baseSpeed * 11);
            
            if(leftPressed && playerX > 8) playerX -= 5.5;
            if(rightPressed && playerX < canvas.width - playerWidth - 8) playerX += 5.5;
            
            for(let i = 0; i < enemies.length; i++) {
                enemies[i].y += baseSpeed;
                for(let j = i+1; j < enemies.length; j++) {
                    if(Math.abs(enemies[i].x - enemies[j].x) < 44 && Math.abs(enemies[i].y - enemies[j].y) < 56) {
                        if(enemies[i].y < enemies[j].y) enemies[i].y -= 3;
                        else enemies[i].y += 3;
                        if(enemies[i].y < -60) enemies[i].y = -60;
                    }
                }
                if(enemies[i].y > canvas.height + 60) {
                    enemies.splice(i,1); i--; score++;
                    spawnEnemy();
                }
            }
            if(enemies.length < 3 && gameRunning) { spawnDelay++; if(spawnDelay > 25) { spawnEnemy(); spawnDelay = 0; } }
            else spawnDelay = 0;
            
            for(let e of enemies) {
                if(playerX < e.x + e.width && playerX + playerWidth > e.x && playerY < e.y + e.height && playerY + playerHeight > e.y) {
                    gameRunning = false;
                    saveHighScore(score);
                    alert('💥 GAME OVER! 💥\nSkor: ' + score + '\nSkor tertinggi: ' + (localStorage.getItem('racing_best')||0));
                    restartGame();
                    return;
                }
            }
        }
        
        function restartGame() {
            gameRunning = true; score = 0; baseSpeed = 3.8; playerX = canvas.width / 2 - 23;
            enemies = [];
            for(let i = 0; i < 2; i++) { spawnEnemy(); if(enemies[i]) enemies[i].y = -100 - i * 150; }
            spawnDelay = 0;
        }
        
        function drawCar(x,y,w,h,color,isPlayer) {
            ctx.fillStyle = color; ctx.shadowBlur = isPlayer ? 10 : 5; ctx.shadowColor = isPlayer ? '#0ff' : '#f00';
            ctx.beginPath(); ctx.roundRect(x,y,w,h,10); ctx.fill();
            ctx.fillStyle = isPlayer ? '#88ddff' : '#335588'; ctx.beginPath(); ctx.roundRect(x+8,y+8,w-16,14,5); ctx.fill();
            ctx.fillStyle = '#ffcc44'; ctx.fillRect(x+5,y+3,7,6); ctx.fillRect(x+w-12,y+3,7,6);
            ctx.fillStyle = '#ff4422'; ctx.fillRect(x+5,y+h-10,7,6); ctx.fillRect(x+w-12,y+h-10,7,6);
            ctx.fillStyle = '#1a1a1a'; ctx.fillRect(x+5,y+h-12,8,8); ctx.fillRect(x+w-13,y+h-12,8,8); ctx.fillRect(x+5,y+3,8,8); ctx.fillRect(x+w-13,y+3,8,8);
            if(isPlayer) { ctx.fillStyle = '#aaa'; ctx.fillRect(x-4,y+15,4,6); ctx.fillRect(x+w,y+15,4,6); }
        }
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r) {
                if(w<2*r) r=w/2; if(h<2*r) r=h/2;
                this.moveTo(x+r,y); this.lineTo(x+w-r,y); this.quadraticCurveTo(x+w,y,x+w,y+r);
                this.lineTo(x+w,y+h-r); this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
                this.lineTo(x+r,y+h); this.quadraticCurveTo(x,y+h,x,y+h-r);
                this.lineTo(x,y+r); this.quadraticCurveTo(x,y,x+r,y);
                return this;
            };
        }
        
        function draw() {
            ctx.fillStyle = '#151525'; ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.beginPath(); ctx.setLineDash([15,28]); ctx.strokeStyle = '#ffff88'; ctx.lineWidth = 3;
            for(let i=0;i<18;i++) { ctx.beginPath(); ctx.moveTo(canvas.width/2, (i*40 + Date.now()*0.003*baseSpeed)%550); ctx.lineTo(canvas.width/2, (i*40 + Date.now()*0.003*baseSpeed+25)%550); ctx.stroke(); }
            ctx.setLineDash([]);
            ctx.strokeStyle = '#55aaff'; ctx.lineWidth = 2; ctx.strokeRect(6,6,canvas.width-12,canvas.height-12);
            for(let e of enemies) drawCar(e.x,e.y,e.width,e.height,e.color,false);
            drawCar(playerX,playerY,playerWidth,playerHeight,'#3eff9e',true);
            ctx.font = "bold 18px 'Courier New'"; ctx.fillStyle = "#0ff"; ctx.fillText("🏆 " + score, 15, 35);
            let best = localStorage.getItem('racing_best') || 0;
            ctx.font = "12px monospace"; ctx.fillStyle = "#aaa"; ctx.fillText("BEST: "+best, canvas.width-70, 30);
            if(baseSpeed > 7) { ctx.font = "bold 12px monospace"; ctx.fillStyle = "#ff6666"; ctx.fillText("⚠️ HIGH SPEED ⚠️", canvas.width/2-55, 25); }
        }
        
        window.addEventListener('keydown', (e) => { const key=e.key; if(key==='ArrowLeft'||key==='a'||key==='A') leftPressed=true; if(key==='ArrowRight'||key==='d'||key==='D') rightPressed=true; e.preventDefault(); });
        window.addEventListener('keyup', (e) => { const key=e.key; if(key==='ArrowLeft'||key==='a'||key==='A') leftPressed=false; if(key==='ArrowRight'||key==='d'||key==='D') rightPressed=false; });
        const leftBtn=document.getElementById('leftBtn'), rightBtn=document.getElementById('rightBtn');
        leftBtn.addEventListener('touchstart',(e)=>{e.preventDefault(); leftPressed=true;}); leftBtn.addEventListener('touchend',()=>{leftPressed=false;}); leftBtn.addEventListener('mousedown',()=>{leftPressed=true;}); leftBtn.addEventListener('mouseup',()=>{leftPressed=false;});
        rightBtn.addEventListener('touchstart',(e)=>{e.preventDefault(); rightPressed=true;}); rightBtn.addEventListener('touchend',()=>{rightPressed=false;}); rightBtn.addEventListener('mousedown',()=>{rightPressed=true;}); rightBtn.addEventListener('mouseup',()=>{rightPressed=false;});
        
        function gameLoop() { updateGame(); draw(); requestAnimationFrame(gameLoop); }
        gameLoop();
    })();
</script>
</body>
</html>

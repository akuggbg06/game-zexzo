<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Last Stand: Survival - Inorya</title>
    <style>
        * { user-select: none; touch-action: manipulation; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #0a0f1a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        canvas {
            display: block;
            background: #1a2a2a;
            cursor: crosshair;
            box-shadow: 0 0 0 2px cyan;
        }
        .ui-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            padding: 10px 18px;
            border-radius: 12px;
            color: white;
            font-size: 14px;
            z-index: 10;
            pointer-events: none;
            backdrop-filter: blur(4px);
            border-left: 4px solid cyan;
            font-weight: bold;
        }
        .ui-panel div { margin: 5px 0; }
        .controls-info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.6);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 10px;
            color: #ccc;
            pointer-events: none;
        }
        .back-home {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 8px 16px;
            border-radius: 25px;
            z-index: 10;
        }
        .back-home a { color: cyan; text-decoration: none; font-size: 13px; font-weight: bold; }
        .back-home a:hover { color: white; }
        .build-menu {
            position: absolute;
            bottom: 80px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            border-radius: 12px;
            z-index: 10;
            font-size: 11px;
            text-align: center;
            border: 1px solid cyan;
        }
        .build-btn {
            background: #1a3a4a;
            border: none;
            color: cyan;
            padding: 5px 10px;
            margin: 3px;
            border-radius: 8px;
            cursor: pointer;
            font-family: monospace;
        }
        @media (max-width: 700px) {
            .ui-panel { font-size: 10px; padding: 5px 10px; }
            .build-menu { font-size: 9px; bottom: 60px; }
            .build-btn { font-size: 9px; }
        }
    </style>
</head>
<body>
<div>
    <canvas id="gameCanvas" width="1000" height="650"></canvas>
    <div class="ui-panel">
        <div>🔫 AMMO: <span id="ammoVal" style="color:#ffaa44">∞</span></div>
        <div>❤️ HEALTH: <span id="healthVal" style="color:#ff6666">100</span> %</div>
        <div>🍗 HUNGER: <span id="hungerVal" style="color:#88ff88">100</span> %</div>
        <div>💧 THIRST: <span id="thirstVal" style="color:#44aaff">100</span> %</div>
        <div>🏆 SCORE: <span id="scoreVal">0</span></div>
        <div>🪵 WOOD: <span id="woodVal">0</span></div>
    </div>
    <div class="build-menu">
        🏠 BUILD:
        <button class="build-btn" id="buildWall">🧱 WALL (50 wood)</button>
        <button class="build-btn" id="buildCampfire">🔥 CAMPFIRE (30 wood)</button>
    </div>
    <div class="controls-info">
        🎮 WASD gerak | 🖱️ Klik kiri tembak (unlimited ammo) | 🪓 Tebang pohon (mendekat & klik) | 🍖 Ambil makanan/minuman
    </div>
    <div class="back-home"><a href="../index.html">🏠 KEMBALI KE HOME</a></div>
</div>

<script>
    (function(){
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 1000;
        canvas.height = 650;
        
        // ---------- KAMERA (buat map besar) ----------
        let cameraX = 0, cameraY = 0;
        const WORLD_SIZE = 3000; // dunia 3000x3000
        
        // ---------- PLAYER ----------
        let player = {
            x: WORLD_SIZE/2,
            y: WORLD_SIZE/2,
            radius: 18,
            health: 100,
            hunger: 100,
            thirst: 100,
            score: 0,
            wood: 0,
            alive: true
        };
        
        // ---------- BULLETS (unlimited ammo) ----------
        let bullets = [];
        let mouseX = 0, mouseY = 0;
        let mouseDown = false;
        let shootCooldown = 0;
        
        // ---------- ENEMIES ----------
        let enemies = [];
        let enemySpawnTimer = 0;
        
        // ---------- ITEMS ----------
        let items = [];
        
        // ---------- TREES (pohon) ----------
        let trees = [];
        for(let i=0; i<80; i++) {
            trees.push({
                x: 100 + Math.random() * (WORLD_SIZE - 200),
                y: 100 + Math.random() * (WORLD_SIZE - 200),
                radius: 14,
                hp: 3
            });
        }
        
        // ---------- BUILDINGS (rumah, tembok, campfire) ----------
        let buildings = [];
        
        // ---------- KEYBOARD ----------
        const keys = { w: false, s: false, a: false, d: false };
        
        // ---------- UPDATE UI ----------
        function updateUI() {
            document.getElementById('ammoVal').innerHTML = '∞';
            document.getElementById('healthVal').innerText = Math.floor(player.health);
            document.getElementById('hungerVal').innerText = Math.floor(player.hunger);
            document.getElementById('thirstVal').innerText = Math.floor(player.thirst);
            document.getElementById('scoreVal').innerText = player.score;
            document.getElementById('woodVal').innerText = player.wood;
        }
        
        // ---------- SPAWN ITEM ----------
        function spawnItem(x, y, type) {
            items.push({
                x: x, y: y, radius: 12, type: type
            });
        }
        
        // ---------- SPAWN MUSUH ----------
        function spawnEnemy() {
            let side = Math.floor(Math.random() * 4);
            let x, y;
            if(side === 0) { x = player.x + (Math.random() - 0.5) * 600 + 300; y = player.y - 400; }
            else if(side === 2) { x = player.x + (Math.random() - 0.5) * 600 - 300; y = player.y + 400; }
            else if(side === 1) { x = player.x + 500; y = player.y + (Math.random() - 0.5) * 500; }
            else { x = player.x - 500; y = player.y + (Math.random() - 0.5) * 500; }
            
            x = Math.min(Math.max(x, 50), WORLD_SIZE-50);
            y = Math.min(Math.max(y, 50), WORLD_SIZE-50);
            
            enemies.push({
                x: x, y: y, radius: 18, hp: 45,
                speed: 0.65 + Math.random() * 0.5,
                damage: 12
            });
        }
        
        // ---------- BUILDING FUNCTIONS ----------
        function buildWall() {
            if(player.wood >= 50) {
                player.wood -= 50;
                buildings.push({
                    x: player.x, y: player.y, type: 'wall', radius: 20, hp: 80
                });
                updateUI();
            } else { alert("Wood kurang! Tebang pohon dulu."); }
        }
        
        function buildCampfire() {
            if(player.wood >= 30) {
                player.wood -= 30;
                buildings.push({
                    x: player.x, y: player.y, type: 'campfire', radius: 18, hp: 40
                });
                updateUI();
            } else { alert("Wood kurang!"); }
        }
        
        // ---------- UPDATE GAME ----------
        function updateGame() {
            if(!player.alive) return;
            
            // Turunkan hunger/thirst lebih lambat
            player.hunger -= 0.003;
            player.thirst -= 0.004;
            if(player.hunger <= 0) { player.health -= 0.08; player.hunger = 0; }
            if(player.thirst <= 0) { player.health -= 0.1; player.thirst = 0; }
            if(player.hunger > 100) player.hunger = 100;
            if(player.thirst > 100) player.thirst = 100;
            
            if(player.health <= 0) { 
                player.alive = false; 
                alert("☠️ KAMU MATI! ☠️\nSkor akhir: "+player.score+"\nRefresh untuk restart"); 
                return; 
            }
            
            // Gerak Player WASD
            let moveX = 0, moveY = 0;
            if(keys.d) moveX = 1;
            if(keys.a) moveX = -1;
            if(keys.s) moveY = 1;
            if(keys.w) moveY = -1;
            let len = Math.hypot(moveX, moveY);
            if(len > 0) { moveX /= len; moveY /= len; }
            player.x += moveX * 3.5;
            player.y += moveY * 3.5;
            player.x = Math.min(Math.max(player.x, 30), WORLD_SIZE-30);
            player.y = Math.min(Math.max(player.y, 30), WORLD_SIZE-30);
            
            // Update kamera (ngikutin player)
            cameraX = player.x - canvas.width/2;
            cameraY = player.y - canvas.height/2;
            cameraX = Math.min(Math.max(cameraX, 0), WORLD_SIZE - canvas.width);
            cameraY = Math.min(Math.max(cameraY, 0), WORLD_SIZE - canvas.height);
            
            // Tembak (unlimited ammo)
            if(shootCooldown > 0) shootCooldown--;
            if(mouseDown && shootCooldown === 0) {
                let angle = Math.atan2(mouseY + cameraY - player.y, mouseX + cameraX - player.x);
                bullets.push({
                    x: player.x, y: player.y,
                    dirX: Math.cos(angle), dirY: Math.sin(angle),
                    life: true, radius: 5
                });
                shootCooldown = 8;
                mouseDown = false;
            }
            
            // Update Peluru & Collision dengan musuh
            for(let i=0; i<bullets.length; i++) {
                bullets[i].x += bullets[i].dirX * 10;
                bullets[i].y += bullets[i].dirY * 10;
                if(bullets[i].x < -100 || bullets[i].x > WORLD_SIZE+100 || bullets[i].y < -100 || bullets[i].y > WORLD_SIZE+100) {
                    bullets.splice(i,1); i--; continue;
                }
                let hit = false;
                for(let j=0; j<enemies.length; j++) {
                    const e = enemies[j];
                    const dx = bullets[i].x - e.x, dy = bullets[i].y - e.y;
                    if(Math.hypot(dx,dy) < e.radius + 6) {
                        e.hp -= 35;
                        bullets.splice(i,1);
                        hit = true;
                        if(e.hp <= 0) {
                            enemies.splice(j,1);
                            player.score += 15;
                            // Drop item
                            if(Math.random() < 0.3) spawnItem(e.x, e.y, Math.random() < 0.5 ? 'food' : 'water');
                            updateUI();
                        }
                        break;
                    }
                }
                if(hit) { i--; }
            }
            
            // Update Musuh (mendekati player)
            for(let i=0; i<enemies.length; i++) {
                const e = enemies[i];
                const dx = player.x - e.x, dy = player.y - e.y;
                const dist = Math.hypot(dx,dy);
                if(dist > 0.01) {
                    e.x += (dx / dist) * e.speed;
                    e.y += (dy / dist) * e.speed;
                }
                // Collision dengan player (HARUS DI TEMBAK, ga langsung ilang)
                if(Math.hypot(player.x - e.x, player.y - e.y) < player.radius + e.radius) {
                    player.health -= e.damage;
                    // Musuh mundur dikit
                    e.x -= (dx / dist) * 25;
                    e.y -= (dy / dist) * 25;
                    updateUI();
                    if(player.health <= 0) { player.alive = false; alert("KAMU MATI!"); return; }
                }
            }
            
            // Spawn musuh
            enemySpawnTimer++;
            if(enemySpawnTimer > 70 && enemies.length < 10) {
                spawnEnemy();
                enemySpawnTimer = 0;
            }
            
            // Tebang pohon (collision & klik mouse kanan/kiri khusus)
            // Kita pake tombol E buat tebang, biar gak overlapping dengan tembak
            // Tapi biar simpel: saat player dekat pohon dan klik "E"
            // gue bikin otomatis: setiap frame cek jarak dan tebang pake E nanti di keydown
            
            // COLLECT ITEMS
            for(let i=0; i<items.length; i++) {
                const it = items[i];
                if(Math.hypot(player.x - it.x, player.y - it.y) < player.radius + it.radius) {
                    if(it.type === 'food') {
                        player.hunger = Math.min(player.hunger + 35, 100);
                        player.health = Math.min(player.health + 12, 100);
                    } else if(it.type === 'water') {
                        player.thirst = Math.min(player.thirst + 40, 100);
                        player.health = Math.min(player.health + 10, 100);
                    }
                    items.splice(i,1);
                    updateUI();
                    i--;
                }
            }
            
            // Auto spawn item random
            if(items.length < 5 && Math.random() < 0.01) {
                spawnItem(player.x + (Math.random() - 0.5)*300, player.y + (Math.random() - 0.5)*300, Math.random() < 0.5 ? 'food' : 'water');
            }
            
            updateUI();
            
            // Healing dari campfire (jika dekat)
            for(let b of buildings) {
                if(b.type === 'campfire' && Math.hypot(player.x - b.x, player.y - b.y) < 60) {
                    if(player.health < 100) player.health += 0.15;
                    if(player.hunger < 100) player.hunger += 0.1;
                    if(player.thirst < 100) player.thirst += 0.1;
                }
            }
        }
        
        // ---------- DRAW SEMUA (dengan kamera) ----------
        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            
            // Ground dengan grid
            ctx.fillStyle = '#2a4a3a';
            ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.strokeStyle = '#3a6a4a';
            ctx.lineWidth = 0.5;
            let startX = Math.floor(cameraX / 50) * 50;
            let startY = Math.floor(cameraY / 50) * 50;
            for(let x=startX; x<cameraX+canvas.width+50; x+=50) {
                for(let y=startY; y<cameraY+canvas.height+50; y+=50) {
                    ctx.strokeRect(x-cameraX, y-cameraY, 50, 50);
                }
            }
            
            // Trees (pohon)
            for(let t of trees) {
                let screenX = t.x - cameraX;
                let screenY = t.y - cameraY;
                if(screenX > -50 && screenX < canvas.width+50 && screenY > -50 && screenY < canvas.height+50) {
                    ctx.fillStyle = '#5c3a1a';
                    ctx.fillRect(screenX-6, screenY-5, 12, 25);
                    ctx.fillStyle = '#3c9e3c';
                    ctx.beginPath(); ctx.arc(screenX, screenY-8, 14, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#2c7e2c';
                    ctx.beginPath(); ctx.arc(screenX-5, screenY-12, 9, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(screenX+5, screenY-12, 9, 0, Math.PI*2); ctx.fill();
                    // health bar pohon
                    ctx.fillStyle = 'red';
                    ctx.fillRect(screenX-12, screenY-22, 24, 4);
                    ctx.fillStyle = 'green';
                    ctx.fillRect(screenX-12, screenY-22, 24 * (t.hp/3), 4);
                }
            }
            
            // Buildings
            for(let b of buildings) {
                let screenX = b.x - cameraX;
                let screenY = b.y - cameraY;
                if(b.type === 'wall') {
                    ctx.fillStyle = '#8B6914';
                    ctx.fillRect(screenX-15, screenY-15, 30, 30);
                    ctx.fillStyle = '#B8860B';
                    ctx.fillRect(screenX-12, screenY-12, 24, 24);
                } else if(b.type === 'campfire') {
                    ctx.fillStyle = '#ff6600';
                    ctx.beginPath(); ctx.arc(screenX, screenY, 12, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#ffaa33';
                    for(let i=0;i<5;i++) {
                        ctx.beginPath(); ctx.moveTo(screenX, screenY); ctx.lineTo(screenX+Math.sin(Date.now()*0.01+i)*8, screenY-10+Math.cos(Date.now()*0.02)*5); ctx.fill();
                    }
                }
            }
            
            // Items
            for(let it of items) {
                let screenX = it.x - cameraX;
                let screenY = it.y - cameraY;
                ctx.fillStyle = it.type === 'food' ? '#dd8844' : '#44aaff';
                ctx.beginPath(); ctx.arc(screenX, screenY, it.radius-2, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = 'white';
                ctx.font = "16px monospace";
                ctx.fillText(it.type === 'food' ? '🍗' : '💧', screenX-8, screenY+6);
            }
            
            // Enemies
            for(let e of enemies) {
                let screenX = e.x - cameraX;
                let screenY = e.y - cameraY;
                ctx.fillStyle = '#cc3333';
                ctx.shadowBlur = 8;
                ctx.beginPath(); ctx.arc(screenX, screenY, e.radius, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = 'black';
                ctx.font = "bold 14px monospace";
                ctx.fillText("👹", screenX-10, screenY-12);
                // health bar
                ctx.fillStyle = '#ff6666';
                ctx.fillRect(screenX-18, screenY-22, 36, 6);
                ctx.fillStyle = '#00ff00';
                ctx.fillRect(screenX-18, screenY-22, 36 * (e.hp/45), 6);
            }
            
            // Bullets
            for(let b of bullets) {
                let screenX = b.x - cameraX;
                let screenY = b.y - cameraY;
                ctx.fillStyle = 'yellow';
                ctx.beginPath(); ctx.arc(screenX, screenY, 5, 0, Math.PI*2); ctx.fill();
            }
            
            // Player
            let playerScreenX = player.x - cameraX;
            let playerScreenY = player.y - cameraY;
            ctx.fillStyle = '#88ff88';
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#0f0';
            ctx.beginPath(); ctx.arc(playerScreenX, playerScreenY, player.radius, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#224466';
            ctx.beginPath(); ctx.arc(playerScreenX-6, playerScreenY-5, 6, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(playerScreenX+6, playerScreenY-5, 6, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(playerScreenX-5, playerScreenY-6, 2.5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(playerScreenX+7, playerScreenY-6, 2.5, 0, Math.PI*2); ctx.fill();
            
            // Arah aim (mouse)
            let aimX = mouseX + cameraX;
            let aimY = mouseY + cameraY;
            ctx.beginPath(); ctx.moveTo(playerScreenX, playerScreenY); ctx.lineTo(aimX - cameraX, aimY - cameraY); ctx.strokeStyle = 'cyan'; ctx.lineWidth = 2; ctx.stroke();
            
            ctx.fillStyle = 'white';
            ctx.font = "bold 16px monospace";
            ctx.fillText("🔫", playerScreenX+14, playerScreenY-14);
            
            ctx.shadowBlur = 0;
            
            // Mini map
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(canvas.width-130, 10, 120, 120);
            ctx.fillStyle = '#2a5a2a';
            ctx.fillRect(canvas.width-128, 12, 116, 116);
            let minimapScale = 116 / WORLD_SIZE;
            ctx.fillStyle = 'green';
            for(let t of trees) { ctx.fillRect(canvas.width-128 + t.x*minimapScale, 12 + t.y*minimapScale, 2, 2); }
            ctx.fillStyle = 'red';
            for(let e of enemies) { ctx.fillRect(canvas.width-128 + e.x*minimapScale, 12 + e.y*minimapScale, 3, 3); }
            ctx.fillStyle = 'cyan';
            ctx.fillRect(canvas.width-128 + player.x*minimapScale-2, 12 + player.y*minimapScale-2, 5, 5);
        }
        
        // ---------- EVENT LISTENERS ----------
        window.addEventListener('keydown', (e) => {
            let k = e.key.toLowerCase();
            if(k === 'w') keys.w = true;
            if(k === 's') keys.s = true;
            if(k === 'a') keys.a = true;
            if(k === 'd') keys.d = true;
            // Tebang pohon pake E
            if(k === 'e') {
                for(let i=0; i<trees.length; i++) {
                    const t = trees[i];
                    if(Math.hypot(player.x - t.x, player.y - t.y) < 40) {
                        t.hp--;
                        if(t.hp <= 0) {
                            trees.splice(i,1);
                            player.wood += 20;
                            player.score += 5;
                            updateUI();
                            spawnItem(t.x, t.y, 'food');
                        }
                        break;
                    }
                }
            }
            e.preventDefault();
        });
        window.addEventListener('keyup', (e) => {
            let k = e.key.toLowerCase();
            if(k === 'w') keys.w = false;
            if(k === 's') keys.s = false;
            if(k === 'a') keys.a = false;
            if(k === 'd') keys.d = false;
        });
        
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });
        canvas.addEventListener('mousedown', (e) => { if(e.button === 0) { mouseDown = true; e.preventDefault(); } });
        canvas.addEventListener('mouseup', () => { mouseDown = false; });
        
        // Touch support
        canvas.addEventListener('touchmove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.touches[0].clientX - rect.left;
            mouseY = e.touches[0].clientY - rect.top;
            e.preventDefault();
        });
        canvas.addEventListener('touchstart', (e) => { mouseDown = true; e.preventDefault(); });
        canvas.addEventListener('touchend', () => { mouseDown = false; });
        
        document.getElementById('buildWall').addEventListener('click', buildWall);
        document.getElementById('buildCampfire').addEventListener('click', buildCampfire);
        
        // Init spawn
        for(let i=0; i<3; i++) spawnEnemy();
        for(let i=0; i<3; i++) spawnItem(player.x + (Math.random()-0.5)*200, player.y + (Math.random()-0.5)*200, Math.random()<0.5?'food':'water');
        
        updateUI();
        
        function gameLoop() { updateGame(); draw(); requestAnimationFrame(gameLoop); }
        gameLoop();
    })();
</script>
</body>
</html>

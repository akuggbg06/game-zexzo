<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>RACING SIMPLE - Jemboutysdg</title>
    <style>
        * {
            user-select: none;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(180deg, #0a0f1e 0%, #1a1a2e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
        }
        .game-container {
            background: #0a0a1a;
            padding: 15px;
            border-radius: 20px;
            border: 2px solid cyan;
            box-shadow: 0 0 20px rgba(0,255,255,0.3);
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,255,255,0.5);
            background: #1a1a2a;
        }
        .info {
            text-align: center;
            margin-top: 10px;
            color: cyan;
            font-size: 14px;
        }
        .speed {
            text-align: center;
            color: yellow;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        button {
            background: linear-gradient(145deg, #1a1a2e, #0a0a1a);
            border: 1px solid cyan;
            color: cyan;
            font-size: 20px;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-family: monospace;
            box-shadow: 0 4px 0 #004466;
            transition: 0.03s linear;
            min-width: 80px;
        }
        button:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #004466;
        }
        .key-hint {
            text-align: center;
            margin-top: 10px;
            font-size: 10px;
            color: #888;
        }
        @media (max-width: 600px) {
            button { padding: 8px 16px; font-size: 18px; min-width: 65px; }
            .speed { font-size: 16px; }
        }
    </style>
</head>
<body>
<div>
    <div class="game-container">
        <div class="speed">🏁 SPEED: <span id="speedVal">0</span> KM/H 🏁</div>
        <canvas id="gameCanvas" width="500" height="500"></canvas>
        <div class="controls" id="touchControls">
            <button id="leftBtn">◀ KIRI</button>
            <button id="upBtn">▲ MAJU</button>
            <button id="downBtn">▼ MUNDUR</button>
            <button id="rightBtn">KANAN ▶</button>
        </div>
        <div class="key-hint">⌨️ LAPTOP: PANAH atau WASD | 📱 HP: TEKAN TOMBOL</div>
        <div class="info">🚗 Hindari Mobil Merah! 🚗</div>
    </div>
</div>

<script>
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Ukuran canvas
        canvas.width = 500;
        canvas.height = 500;
        
        // Player
        let playerX = canvas.width / 2 - 25;
        let playerY = canvas.height - 80;
        const playerWidth = 50;
        const playerHeight = 50;
        
        // Musuh (mobil lawan)
        let enemies = [];
        
        // Skor & kecepatan
        let score = 0;
        let speed = 3;
        let gameRunning = true;
        let frameCount = 0;
        
        // Input flags
        let leftPressed = false;
        let rightPressed = false;
        let upPressed = false;
        let downPressed = false;
        
        // Warna musuh
        const enemyColors = ['#ff4444', '#ff6666', '#cc3333', '#ff5555', '#ff2222'];
        
        // Buat musuh baru
        function spawnEnemy() {
            const x = Math.random() * (canvas.width - 40);
            enemies.push({
                x: x,
                y: -50,
                width: 40,
                height: 50,
                color: enemyColors[Math.floor(Math.random() * enemyColors.length)]
            });
        }
        
        // Spawn awal
        for(let i = 0; i < 4; i++) {
            spawnEnemy();
            enemies[i].y = -100 - i * 80;
        }
        
        // Update game
        function updateGame() {
            if(!gameRunning) return;
            
            // Gerak maju mundur
            if(upPressed) {
                speed += 0.2;
                if(speed > 12) speed = 12;
            }
            if(downPressed) {
                speed -= 0.3;
                if(speed < 1) speed = 1;
            }
            
            // Natural friction
            if(!upPressed && !downPressed) {
                speed *= 0.99;
                if(speed < 2) speed = 2;
            }
            
            // Gerak kiri kanan
            if(leftPressed && playerX > 5) {
                playerX -= 6;
            }
            if(rightPressed && playerX < canvas.width - playerWidth - 5) {
                playerX += 6;
            }
            
            // Update speedometer
            let displaySpeed = Math.floor(speed * 8);
            document.getElementById('speedVal').innerText = displaySpeed;
            
            // Update posisi musuh
            for(let i = 0; i < enemies.length; i++) {
                enemies[i].y += speed;
                
                // Spawn ulang kalo keluar layar
                if(enemies[i].y > canvas.height) {
                    enemies[i].y = -50;
                    enemies[i].x = Math.random() * (canvas.width - 40);
                    score += 10;
                }
            }
            
            // Spawn musuh baru setiap frame tertentu
            frameCount++;
            if(frameCount > 40 && enemies.length < 8) {
                spawnEnemy();
                frameCount = 0;
            }
            
            // COLLISION DETECTION
            for(let i = 0; i < enemies.length; i++) {
                const e = enemies[i];
                if(playerX < e.x + e.width &&
                   playerX + playerWidth > e.x &&
                   playerY < e.y + e.height &&
                   playerY + playerHeight > e.y) {
                    gameRunning = false;
                    alert('💥 GAME OVER! 💥\nSkor: ' + score + '\nTekan OK untuk restart');
                    restartGame();
                    return;
                }
            }
        }
        
        function restartGame() {
            gameRunning = true;
            score = 0;
            speed = 3;
            playerX = canvas.width / 2 - 25;
            enemies = [];
            for(let i = 0; i < 4; i++) {
                spawnEnemy();
                enemies[i].y = -100 - i * 80;
            }
            document.getElementById('speedVal').innerText = '0';
        }
        
        // DRAW SEMUA
        function draw() {
            // Background jalan
            ctx.fillStyle = '#1a1a2a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Garis jalan
            ctx.strokeStyle = '#ffff00';
            ctx.lineWidth = 3;
            ctx.setLineDash([20, 30]);
            for(let i = 0; i < 10; i++) {
                ctx.beginPath();
                ctx.moveTo(canvas.width/2, i * 50);
                ctx.lineTo(canvas.width/2, i * 50 + 30);
                ctx.stroke();
            }
            ctx.setLineDash([]);
            
            // Garis pinggir
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);
            
            // Gambar musuh
            for(let e of enemies) {
                // Body mobil musuh
                ctx.fillStyle = e.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = 'red';
                ctx.fillRect(e.x, e.y, e.width, e.height);
                
                // Kaca
                ctx.fillStyle = '#333366';
                ctx.fillRect(e.x + 8, e.y + 8, e.width - 16, 15);
                
                // Lampu
                ctx.fillStyle = '#ffff00';
                ctx.fillRect(e.x + 5, e.y + e.height - 10, 8, 6);
                ctx.fillRect(e.x + e.width - 13, e.y + e.height - 10, 8, 6);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(e.x + 5, e.y + 2, 6, 6);
                ctx.fillRect(e.x + e.width - 11, e.y + 2, 6, 6);
                
                // Roda
                ctx.fillStyle = '#222';
                ctx.fillRect(e.x + 5, e.y + e.height - 12, 8, 8);
                ctx.fillRect(e.x + e.width - 13, e.y + e.height - 12, 8, 8);
                ctx.fillRect(e.x + 5, e.y + 2, 8, 8);
                ctx.fillRect(e.x + e.width - 13, e.y + 2, 8, 8);
            }
            
            // Gambar PLAYER (mobil hijau)
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#0ff';
            ctx.fillStyle = '#33ff88';
            ctx.fillRect(playerX, playerY, playerWidth, playerHeight);
            
            // Kaca mobil player
            ctx.fillStyle = '#88ccff';
            ctx.fillRect(playerX + 10, playerY + 8, playerWidth - 20, 15);
            
            // Lampu player
            ctx.fillStyle = '#ffaa44';
            ctx.fillRect(playerX + 5, playerY + playerHeight - 10, 8, 6);
            ctx.fillRect(playerX + playerWidth - 13, playerY + playerHeight - 10, 8, 6);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(playerX + 5, playerY + 2, 6, 6);
            ctx.fillRect(playerX + playerWidth - 11, playerY + 2, 6, 6);
            
            // Roda player
            ctx.fillStyle = '#111';
            ctx.fillRect(playerX + 5, playerY + playerHeight - 12, 8, 8);
            ctx.fillRect(playerX + playerWidth - 13, playerY + playerHeight - 12, 8, 8);
            ctx.fillRect(playerX + 5, playerY + 2, 8, 8);
            ctx.fillRect(playerX + playerWidth - 13, playerY + 2, 8, 8);
            
            ctx.shadowBlur = 0;
            
            // Skor
            ctx.font = "bold 18px monospace";
            ctx.fillStyle = "#0ff";
            ctx.shadowBlur = 0;
            ctx.fillText("SCORE: " + score, 15, 35);
        }
        
        // ============ INPUT HANDLER ============
        // Keyboard
        window.addEventListener('keydown', (e) => {
            const key = e.key;
            if(key === 'ArrowLeft' || key === 'a' || key === 'A') leftPressed = true;
            if(key === 'ArrowRight' || key === 'd' || key === 'D') rightPressed = true;
            if(key === 'ArrowUp' || key === 'w' || key === 'W') upPressed = true;
            if(key === 'ArrowDown' || key === 's' || key === 'S') downPressed = true;
            e.preventDefault();
        });
        
        window.addEventListener('keyup', (e) => {
            const key = e.key;
            if(key === 'ArrowLeft' || key === 'a' || key === 'A') leftPressed = false;
            if(key === 'ArrowRight' || key === 'd' || key === 'D') rightPressed = false;
            if(key === 'ArrowUp' || key === 'w' || key === 'W') upPressed = false;
            if(key === 'ArrowDown' || key === 's' || key === 'S') downPressed = false;
        });
        
        // Tombol touch (HP)
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');
        const upBtn = document.getElementById('upBtn');
        const downBtn = document.getElementById('downBtn');
        
        leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); leftPressed = true; });
        leftBtn.addEventListener('touchend', () => { leftPressed = false; });
        leftBtn.addEventListener('mousedown', () => { leftPressed = true; });
        leftBtn.addEventListener('mouseup', () => { leftPressed = false; });
        
        rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); rightPressed = true; });
        rightBtn.addEventListener('touchend', () => { rightPressed = false; });
        rightBtn.addEventListener('mousedown', () => { rightPressed = true; });
        rightBtn.addEventListener('mouseup', () => { rightPressed = false; });
        
        upBtn.addEventListener('touchstart', (e) => { e.preventDefault(); upPressed = true; });
        upBtn.addEventListener('touchend', () => { upPressed = false; });
        upBtn.addEventListener('mousedown', () => { upPressed = true; });
        upBtn.addEventListener('mouseup', () => { upPressed = false; });
        
        downBtn.addEventListener('touchstart', (e) => { e.preventDefault(); downPressed = true; });
        downBtn.addEventListener('touchend', () => { downPressed = false; });
        downBtn.addEventListener('mousedown', () => { downPressed = true; });
        downBtn.addEventListener('mouseup', () => { downPressed = false; });
        
        // Animasi loop
        function gameLoop() {
            updateGame();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        gameLoop();
    })();
</script>
</body>
</html>

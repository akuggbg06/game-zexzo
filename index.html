<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3D RACING - Inorya (HP Friendly)</title>
    <style>
        * {
            user-select: none;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            background: #0a0f1e;
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #speedometer {
            position: absolute;
            bottom: 140px;
            right: 15px;
            background: rgba(0,0,0,0.8);
            color: cyan;
            padding: 12px 20px;
            border-radius: 50%;
            font-size: 24px;
            font-weight: bold;
            font-family: monospace;
            z-index: 10;
            border: 2px solid cyan;
            text-align: center;
            backdrop-filter: blur(5px);
        }
        #speedometer small {
            font-size: 10px;
            display: block;
        }
        .controls-panel {
            position: fixed;
            bottom: 15px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 12px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            z-index: 20;
            flex-wrap: wrap;
            border-top: 1px solid cyan;
        }
        .ctrl-btn {
            background: linear-gradient(145deg, #1a1a2e, #0a0a1a);
            border: 1px solid cyan;
            color: cyan;
            font-size: 28px;
            font-weight: bold;
            padding: 12px 24px;
            border-radius: 60px;
            text-align: center;
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: 0 5px 0 #004466;
            transition: 0.05s linear;
            font-family: monospace;
            min-width: 80px;
        }
        .ctrl-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #004466;
        }
        .info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 10px;
            z-index: 10;
            font-family: monospace;
            pointer-events: none;
        }
        @media (max-width: 700px) {
            .ctrl-btn { padding: 8px 18px; font-size: 22px; min-width: 65px; }
            #speedometer { bottom: 120px; padding: 8px 15px; font-size: 20px; }
        }
        @media (max-width: 500px) {
            .ctrl-btn { padding: 6px 14px; font-size: 18px; min-width: 55px; }
            .controls-panel { gap: 8px; }
        }
    </style>
</head>
<body>
    <div class="info">🏁 3D RACING | Tekan tombol di bawah</div>
    <div id="speedometer">0<small>KM/H</small></div>
    <div class="controls-panel">
        <div class="ctrl-btn" id="btnLeft">◀ KIRI</div>
        <div class="ctrl-btn" id="btnUp">▲ MAJU</div>
        <div class="ctrl-btn" id="btnDown">▼ MUNDUR</div>
        <div class="ctrl-btn" id="btnRight">KANAN ▶</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        // ============ SETUP CANVAS 2D TAPI 3D STYLE (RINGAN BUAT HP) ============
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let canvasWidth, canvasHeight;
        
        function resizeCanvas() {
            canvasWidth = window.innerWidth;
            canvasHeight = window.innerHeight;
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // ============ GAME STATE ============
        let carX = canvasWidth / 2;
        let carZ = 0; // posisi di track (0 = tengah)
        let carSpeed = 0;
        let steeringAngle = 0;
        let roadOffset = 0;
        
        // Track properties
        const trackWidth = 300;
        const laneCount = 3;
        const maxSpeed = 12;
        const acceleration = 0.35;
        const brakeForce = 0.5;
        const turnSpeed = 0.12;
        
        // Obstacles / other cars
        let obstacles = [];
        
        // Input flags (untuk touch dan keyboard)
        let inputUp = false;
        let inputDown = false;
        let inputLeft = false;
        let inputRight = false;
        
        // ============ BUAT OBSTACLE (MUSUH) ============
        function spawnObstacle() {
            const lane = Math.floor(Math.random() * 3) - 1; // -1, 0, 1
            obstacles.push({
                x: lane * 45,
                z: -350,
                width: 35,
                height: 30,
                color: `hsl(${Math.random() * 40 + 350}, 70%, 55%)`
            });
        }
        
        // Spawn awal
        for(let i = 0; i < 5; i++) {
            spawnObstacle();
            obstacles[obstacles.length-1].z = -100 - i * 80;
        }
        
        // Timer spawn
        let spawnCounter = 0;
        
        // ============ GAMBAR JALAN 3D STYLE (PSEUDO 3D) ============
        function drawRoad() {
            // Langit gradien
            const gradSky = ctx.createLinearGradient(0, 0, 0, canvasHeight/2);
            gradSky.addColorStop(0, '#0a0f2a');
            gradSky.addColorStop(1, '#1a1a3e');
            ctx.fillStyle = gradSky;
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);
            
            // Ground (aspal)
            ctx.fillStyle = '#1a1a2a';
            ctx.fillRect(0, canvasHeight/2, canvasWidth, canvasHeight/2);
            
            // Perspektif jalan
            const centerX = canvasWidth / 2;
            const horizonY = canvasHeight * 0.45;
            const roadWidthBase = 300;
            const roadWidthTop = 120;
            
            // Geser jalan berdasarkan posisi mobil
            const roadOffsetPixels = (carX - canvasWidth/2) * 0.4;
            
            // Gambar aspal
            ctx.beginPath();
            ctx.moveTo(centerX - roadWidthBase/2 + roadOffsetPixels, canvasHeight);
            ctx.lineTo(centerX - roadWidthTop/2 + roadOffsetPixels, horizonY);
            ctx.lineTo(centerX + roadWidthTop/2 + roadOffsetPixels, horizonY);
            ctx.lineTo(centerX + roadWidthBase/2 + roadOffsetPixels, canvasHeight);
            ctx.fillStyle = '#222';
            ctx.fill();
            
            // Pinggir jalan (putih)
            ctx.beginPath();
            ctx.moveTo(centerX - roadWidthBase/2 + roadOffsetPixels, canvasHeight);
            ctx.lineTo(centerX - roadWidthTop/2 + roadOffsetPixels, horizonY);
            ctx.lineTo(centerX - roadWidthTop/2 + 8 + roadOffsetPixels, horizonY);
            ctx.lineTo(centerX - roadWidthBase/2 + 15 + roadOffsetPixels, canvasHeight);
            ctx.fillStyle = '#ffee88';
            ctx.fill();
            
            ctx.beginPath();
            ctx.moveTo(centerX + roadWidthBase/2 + roadOffsetPixels, canvasHeight);
            ctx.lineTo(centerX + roadWidthTop/2 + roadOffsetPixels, horizonY);
            ctx.lineTo(centerX + roadWidthTop/2 - 8 + roadOffsetPixels, horizonY);
            ctx.lineTo(centerX + roadWidthBase/2 - 15 + roadOffsetPixels, canvasHeight);
            ctx.fill();
            
            // Garis tengah putus-putus
            ctx.beginPath();
            ctx.setLineDash([20, 30]);
            ctx.lineWidth = 5;
            ctx.strokeStyle = '#ffff88';
            for(let i = 0; i < 12; i++) {
                const y = horizonY + i * 40;
                if(y > canvasHeight) break;
                const t = (y - horizonY) / (canvasHeight - horizonY);
                const lineWidth = roadWidthTop + (roadWidthBase - roadWidthTop) * t;
                const x = centerX - lineWidth/2 + roadOffsetPixels + lineWidth/2;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x, y + 20);
                ctx.stroke();
            }
            ctx.setLineDash([]);
            
            // === GAMBAR MOBIL MUSUH ===
            for(let obs of obstacles) {
                const obsZ = obs.z + roadOffset;
                if(obsZ > 50 && obsZ < canvasHeight + 100) {
                    const t = (obsZ - 50) / (canvasHeight);
                    const size = 35 * (1 - t * 0.6);
                    const yPos = horizonY + t * (canvasHeight - horizonY) - 40;
                    if(yPos > canvasHeight) continue;
                    
                    const laneOffset = obs.x;
                    const roadWidthAtY = roadWidthTop + (roadWidthBase - roadWidthTop) * t;
                    const xPos = centerX + laneOffset * (roadWidthAtY / 100) + roadOffsetPixels - size/2;
                    
                    // Body mobil musuh
                    ctx.fillStyle = obs.color;
                    ctx.shadowBlur = 8;
                    ctx.fillRect(xPos, yPos, size, size * 0.9);
                    ctx.fillStyle = '#333';
                    ctx.fillRect(xPos + size*0.2, yPos + size*0.2, size*0.6, size*0.3);
                    ctx.fillStyle = '#aaa';
                    ctx.fillRect(xPos + size*0.1, yPos + size*0.6, size*0.2, size*0.15);
                    ctx.fillRect(xPos + size*0.7, yPos + size*0.6, size*0.2, size*0.15);
                    ctx.shadowBlur = 0;
                }
            }
            
            // === GAMBAR MOBIL PLAYER ===
            const playerY = canvasHeight - 100;
            const playerSize = 50;
            ctx.shadowBlur = 12;
            ctx.shadowColor = 'cyan';
            ctx.fillStyle = '#33ff88';
            ctx.beginPath();
            ctx.roundRect(carX - playerSize/2, playerY, playerSize, playerSize * 0.85, 10);
            ctx.fill();
            ctx.fillStyle = '#aaffff';
            ctx.fillRect(carX - playerSize/4, playerY + 8, playerSize/2, playerSize/3);
            ctx.fillStyle = '#ffaa33';
            ctx.fillRect(carX - playerSize/3, playerY + playerSize*0.55, playerSize/3, 8);
            ctx.fillRect(carX + playerSize/6, playerY + playerSize*0.55, playerSize/3, 8);
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(carX - playerSize/5, playerY + playerSize*0.25, 6, 0, Math.PI*2);
            ctx.arc(carX + playerSize/5, playerY + playerSize*0.25, 6, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(carX - playerSize/5 - 2, playerY + playerSize*0.23, 2, 0, Math.PI*2);
            ctx.arc(carX + playerSize/5 - 2, playerY + playerSize*0.23, 2, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // Lampu depan
            ctx.fillStyle = '#ffaa66';
            ctx.fillRect(carX - playerSize/3, playerY - 5, 8, 8);
            ctx.fillRect(carX + playerSize/3 - 8, playerY - 5, 8, 8);
        }
        
        // Helper roundRect
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.moveTo(x+r, y);
                this.lineTo(x+w-r, y);
                this.quadraticCurveTo(x+w, y, x+w, y+r);
                this.lineTo(x+w, y+h-r);
                this.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
                this.lineTo(x+r, y+h);
                this.quadraticCurveTo(x, y+h, x, y+h-r);
                this.lineTo(x, y+r);
                this.quadraticCurveTo(x, y, x+r, y);
                return this;
            };
        }
        
        // ============ UPDATE GAME LOGIC ============
        function updateGame() {
            // Input handling
            if (inputUp) {
                carSpeed += acceleration;
                if (carSpeed > maxSpeed) carSpeed = maxSpeed;
            } else if (inputDown) {
                carSpeed -= brakeForce;
                if (carSpeed < -maxSpeed/2) carSpeed = -maxSpeed/2;
            } else {
                carSpeed *= 0.98;
                if (Math.abs(carSpeed) < 0.2) carSpeed = 0;
            }
            
            // Steering
            if (Math.abs(carSpeed) > 0.5) {
                let steer = 0;
                if (inputLeft) steer = -turnSpeed;
                if (inputRight) steer = turnSpeed;
                steeringAngle += steer * (Math.abs(carSpeed)/maxSpeed);
                steeringAngle = Math.min(Math.max(steeringAngle, -0.4), 0.4);
            } else {
                steeringAngle *= 0.95;
            }
            
            // Pindah posisi mobil
            carX += steeringAngle * 12;
            carX = Math.min(Math.max(carX, 80), canvasWidth - 80);
            
            // Update road offset (buat efek gerak)
            roadOffset += carSpeed * 3;
            
            // Update posisi musuh
            for(let i = 0; i < obstacles.length; i++) {
                obstacles[i].z += carSpeed * 3.5;
                if(obstacles[i].z > canvasHeight + 200) {
                    obstacles.splice(i,1);
                    i--;
                }
            }
            
            // Spawn musuh baru
            spawnCounter++;
            if(spawnCounter > 45 && obstacles.length < 8) {
                spawnObstacle();
                spawnCounter = 0;
            }
            
            // Collision detection (sederhana)
            const playerRect = {
                x: carX - 30,
                y: canvasHeight - 120,
                w: 60,
                h: 55
            };
            
            for(let i = 0; i < obstacles.length; i++) {
                const obs = obstacles[i];
                const t = (obs.z - 50) / (canvasHeight);
                if(t < 0 || t > 1) continue;
                const yPos = canvasHeight * 0.45 + t * (canvasHeight * 0.55) - 40;
                if(yPos > canvasHeight - 50 && yPos < canvasHeight - 20) {
                    const roadWidthAtY = 120 + (300 - 120) * t;
                    const laneOffsetPx = obs.x * (roadWidthAtY / 100);
                    const obsX = canvasWidth/2 + laneOffsetPx + (carX - canvasWidth/2)*0.4 - 20;
                    if(Math.abs(obsX - carX) < 45 && yPos > playerRect.y - 20) {
                        // Tabrakan!
                        carSpeed = -4;
                        steeringAngle = (Math.random() - 0.5) * 0.5;
                        // Efek flash
                        document.body.style.backgroundColor = '#ff000020';
                        setTimeout(() => document.body.style.backgroundColor = '', 100);
                        // Hapus musuh yang ditabrak
                        obstacles.splice(i,1);
                        break;
                    }
                }
            }
            
            // Update speedometer
            const speedKmh = Math.floor(Math.abs(carSpeed) * 14);
            document.getElementById('speedometer').innerHTML = `${speedKmh}<small>KM/H</small>`;
        }
        
        // ============ ANIMASI LOOP ============
        function animate() {
            updateGame();
            drawRoad();
            requestAnimationFrame(animate);
        }
        
        // ============ INPUT HANDLER (TOUCH & KEYBOARD) ============
        function setupControls() {
            // Tombol touch
            document.getElementById('btnUp').addEventListener('touchstart', (e) => { e.preventDefault(); inputUp = true; });
            document.getElementById('btnUp').addEventListener('touchend', () => { inputUp = false; });
            document.getElementById('btnUp').addEventListener('mousedown', () => { inputUp = true; });
            document.getElementById('btnUp').addEventListener('mouseup', () => { inputUp = false; });
            
            document.getElementById('btnDown').addEventListener('touchstart', (e) => { e.preventDefault(); inputDown = true; });
            document.getElementById('btnDown').addEventListener('touchend', () => { inputDown = false; });
            document.getElementById('btnDown').addEventListener('mousedown', () => { inputDown = true; });
            document.getElementById('btnDown').addEventListener('mouseup', () => { inputDown = false; });
            
            document.getElementById('btnLeft').addEventListener('touchstart', (e) => { e.preventDefault(); inputLeft = true; });
            document.getElementById('btnLeft').addEventListener('touchend', () => { inputLeft = false; });
            document.getElementById('btnLeft').addEventListener('mousedown', () => { inputLeft = true; });
            document.getElementById('btnLeft').addEventListener('mouseup', () => { inputLeft = false; });
            
            document.getElementById('btnRight').addEventListener('touchstart', (e) => { e.preventDefault(); inputRight = true; });
            document.getElementById('btnRight').addEventListener('touchend', () => { inputRight = false; });
            document.getElementById('btnRight').addEventListener('mousedown', () => { inputRight = true; });
            document.getElementById('btnRight').addEventListener('mouseup', () => { inputRight = false; });
            
            // Keyboard juga tetep support
            window.addEventListener('keydown', (e) => {
                if(e.key === 'ArrowUp' || e.key === 'w') inputUp = true;
                if(e.key === 'ArrowDown' || e.key === 's') inputDown = true;
                if(e.key === 'ArrowLeft' || e.key === 'a') inputLeft = true;
                if(e.key === 'ArrowRight' || e.key === 'd') inputRight = true;
                e.preventDefault();
            });
            window.addEventListener('keyup', (e) => {
                if(e.key === 'ArrowUp' || e.key === 'w') inputUp = false;
                if(e.key === 'ArrowDown' || e.key === 's') inputDown = false;
                if(e.key === 'ArrowLeft' || e.key === 'a') inputLeft = false;
                if(e.key === 'ArrowRight' || e.key === 'd') inputRight = false;
            });
        }
        
        // Mulai game
        resizeCanvas();
        setupControls();
        animate();
    </script>
</body>
</html>

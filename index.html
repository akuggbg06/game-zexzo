<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D RACING - Inorya</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 10px;
            z-index: 100;
            pointer-events: none;
            font-size: 14px;
            border-left: 4px solid cyan;
        }
        #speedometer {
            position: absolute;
            bottom: 30px;
            right: 30px;
            color: cyan;
            background: rgba(0,0,0,0.8);
            padding: 15px 25px;
            border-radius: 50%;
            font-size: 28px;
            font-weight: bold;
            font-family: monospace;
            z-index: 100;
            pointer-events: none;
            border: 2px solid cyan;
            text-align: center;
        }
        #speedometer small {
            font-size: 12px;
            display: block;
            color: white;
        }
        .controls-hint {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 12px;
            z-index: 100;
            pointer-events: none;
            font-family: monospace;
        }
        @media (max-width: 600px) {
            #speedometer { font-size: 18px; padding: 10px 18px; }
            .controls-hint { font-size: 8px; }
        }
    </style>
</head>
<body>
    <div id="info">
        🏁 3D RACING FURY 🏁
    </div>
    <div id="speedometer">
        0 <small>KM/H</small>
    </div>
    <div class="controls-hint">
        🎮 W/A/S/D atau ↑/←/↓/→ | 🖱️ Mouse untuk geser kamera
    </div>

    <!-- Import Three.js dan library pendukung -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // Setup Scene, Camera, Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050b1a);
        scene.fog = new THREE.FogExp2(0x050b1a, 0.008);

        // Camera
        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 5, 12);
        camera.lookAt(0, 0, 0);

        // Renderers
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        // Controls (kamera bisa digerakin pake mouse)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.zoomSpeed = 1.2;
        controls.panSpeed = 0.8;
        controls.rotateSpeed = 1.0;
        controls.target.set(0, 0.5, 0);

        // Lighting
        // Ambient light
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        
        // Main directional light
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        dirLight.receiveShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);
        
        // Fill light from below
        const fillLight = new THREE.PointLight(0x4466cc, 0.3);
        fillLight.position.set(0, -2, 0);
        scene.add(fillLight);
        
        // Back rim light
        const rimLight = new THREE.PointLight(0xffaa66, 0.5);
        rimLight.position.set(-3, 2, -5);
        scene.add(rimLight);
        
        // Dynamic follow light
        const followLight = new THREE.PointLight(0x88aaff, 0.6);
        scene.add(followLight);

        // Ground / Arena (race track)
        const trackMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.4, metalness: 0.7 });
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 120), trackMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.2;
        ground.receiveShadow = true;
        scene.add(ground);
        
        // Grid helper
        const gridHelper = new THREE.GridHelper(120, 30, 0x44aaff, 0x335588);
        gridHelper.position.y = -0.15;
        scene.add(gridHelper);
        
        // Track lines (road markings)
        const lineMat = new THREE.MeshStandardMaterial({ color: 0xffdd44, emissive: 0x442200 });
        for (let z = -50; z <= 50; z += 3) {
            const line = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.1, 1.5), lineMat);
            line.position.set(0, -0.1, z);
            line.castShadow = true;
            scene.add(line);
        }
        
        // Side barriers
        const barrierMat = new THREE.MeshStandardMaterial({ color: 0xcc8844, roughness: 0.3 });
        for (let side = -1; side <= 1; side += 2) {
            for (let z = -45; z <= 45; z += 4) {
                const barrier = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 2.5), barrierMat);
                barrier.position.set(side * 4.5, 0.1, z);
                barrier.castShadow = true;
                barrier.receiveShadow = true;
                scene.add(barrier);
            }
        }
        
        // Decorative cones
        const coneMat = new THREE.MeshStandardMaterial({ color: 0xff6600 });
        for (let i = -40; i <= 40; i += 5) {
            const cone = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.5, 8), coneMat);
            cone.position.set(3.2, -0.1, i);
            cone.castShadow = true;
            scene.add(cone);
            
            const cone2 = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.5, 8), coneMat);
            cone2.position.set(-3.2, -0.1, i);
            cone2.castShadow = true;
            scene.add(cone2);
        }
        
        // Trees along track
        const treeMatTrunk = new THREE.MeshStandardMaterial({ color: 0x8B5A2B });
        const treeMatLeaf = new THREE.MeshStandardMaterial({ color: 0x3c9e3c });
        for (let i = -45; i <= 45; i += 7) {
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 1.2, 6), treeMatTrunk);
            trunk.position.set(-6, -0.2, i);
            trunk.castShadow = true;
            scene.add(trunk);
            const leaves = new THREE.Mesh(new THREE.ConeGeometry(0.6, 0.9, 8), treeMatLeaf);
            leaves.position.set(-6, 0.5, i);
            leaves.castShadow = true;
            scene.add(leaves);
            
            const trunk2 = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 1.2, 6), treeMatTrunk);
            trunk2.position.set(6, -0.2, i);
            trunk2.castShadow = true;
            scene.add(trunk2);
            const leaves2 = new THREE.Mesh(new THREE.ConeGeometry(0.6, 0.9, 8), treeMatLeaf);
            leaves2.position.set(6, 0.5, i);
            leaves2.castShadow = true;
            scene.add(leaves2);
        }
        
        // Sky particles (stars)
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 800;
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPositions[i*3] = (Math.random() - 0.5) * 400;
            starPositions[i*3+1] = (Math.random() - 0.5) * 80 + 10;
            starPositions[i*3+2] = (Math.random() - 0.5) * 150 - 80;
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.15 });
        const stars = new THREE.Points(starGeometry, starMat);
        scene.add(stars);
        
        // === CAR (Player) ===
        const carGroup = new THREE.Group();
        
        // Body
        const bodyGeo = new THREE.BoxGeometry(0.9, 0.35, 1.8);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff3366, metalness: 0.7, roughness: 0.2, emissive: 0x330000 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.castShadow = true;
        body.receiveShadow = true;
        body.position.y = 0;
        carGroup.add(body);
        
        // Roof/window
        const roofGeo = new THREE.BoxGeometry(0.7, 0.25, 1.0);
        const roofMat = new THREE.MeshStandardMaterial({ color: 0x224466, metalness: 0.8, emissive: 0x001133 });
        const roof = new THREE.Mesh(roofGeo, roofMat);
        roof.position.y = 0.3;
        roof.castShadow = true;
        carGroup.add(roof);
        
        // Wheels
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.5, roughness: 0.4 });
        const positions = [[-0.55, -0.15, -0.7], [0.55, -0.15, -0.7], [-0.55, -0.15, 0.6], [0.55, -0.15, 0.6]];
        positions.forEach(pos => {
            const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.4, 24), wheelMat);
            wheel.rotation.z = Math.PI / 2;
            wheel.position.set(pos[0], pos[1], pos[2]);
            wheel.castShadow = true;
            carGroup.add(wheel);
        });
        
        // Lights
        const redMat = new THREE.MeshStandardMaterial({ color: 0xff3300, emissive: 0xff2200 });
        const whiteMat = new THREE.MeshStandardMaterial({ color: 0xffaa88, emissive: 0xff8844 });
        const frontLight = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), whiteMat);
        frontLight.position.set(0, 0.1, 0.95);
        carGroup.add(frontLight);
        
        const backLight = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), redMat);
        backLight.position.set(0, 0.1, -0.95);
        carGroup.add(backLight);
        
        carGroup.position.set(0, 0.1, 0);
        carGroup.castShadow = true;
        scene.add(carGroup);
        
        // Car state
        let carSpeed = 0;
        let carAngle = 0;
        let steering = 0;
        const maxSpeed = 28;
        const acceleration = 0.5;
        const brakeForce = 0.8;
        const turnSpeed = 1.6;
        
        // Keyboard handling
        const keys = {
            ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false,
            w: false, s: false, a: false, d: false
        };
        
        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
        });
        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
        });
        
        // Speed display
        const speedElem = document.getElementById('speedometer');
        
        // Camera follow (optional but keep orbit controls, just adjust target)
        let cameraTarget = new THREE.Vector3(0, 0.5, 0);
        
        // AI Cars (opponents)
        const aiCars = [];
        const aiColors = [0x44aaff, 0xaa44ff, 0xffaa44, 0x44ffaa, 0xff44aa];
        
        function createAICar(color, zPos) {
            const group = new THREE.Group();
            const bMat = new THREE.MeshStandardMaterial({ color: color, metalness: 0.6, roughness: 0.3 });
            const bodyAI = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.33, 1.7), bMat);
            bodyAI.castShadow = true;
            group.add(bodyAI);
            
            const roofAI = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.23, 0.95), new THREE.MeshStandardMaterial({ color: 0x335577 }));
            roofAI.position.y = 0.28;
            roofAI.castShadow = true;
            group.add(roofAI);
            
            const wheelMatAI = new THREE.MeshStandardMaterial({ color: 0x222222 });
            const aiWheelPos = [[-0.5, -0.13, -0.65], [0.5, -0.13, -0.65], [-0.5, -0.13, 0.55], [0.5, -0.13, 0.55]];
            aiWheelPos.forEach(pos => {
                const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.35, 20), wheelMatAI);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(pos[0], pos[1], pos[2]);
                wheel.castShadow = true;
                group.add(wheel);
            });
            
            group.position.set((Math.random() - 0.5) * 3, 0.1, zPos);
            group.castShadow = true;
            scene.add(group);
            return group;
        }
        
        // Spawn 5 AI cars
        for (let i = 0; i < 6; i++) {
            const zPos = -8 - i * 7;
            const aiCar = createAICar(aiColors[i % aiColors.length], zPos);
            aiCars.push({
                mesh: aiCar,
                speed: 3 + Math.random() * 4,
                z: zPos
            });
        }
        
        // Game loop variables
        let lastTime = performance.now();
        
        // Boundaries
        const leftBound = -3.8;
        const rightBound = 3.8;
        
        function animate() {
            const now = performance.now();
            let delta = Math.min(0.033, (now - lastTime) / 1000);
            lastTime = now;
            
            // Input handling
            let forward = (keys.ArrowUp || keys.w) ? 1 : 0;
            let backward = (keys.ArrowDown || keys.s) ? 1 : 0;
            let left = (keys.ArrowLeft || keys.a) ? 1 : 0;
            let right = (keys.ArrowRight || keys.d) ? 1 : 0;
            
            // Acceleration / Braking
            if (forward) {
                carSpeed += acceleration * delta * 3;
                if (carSpeed > maxSpeed) carSpeed = maxSpeed;
            } else if (backward) {
                carSpeed -= brakeForce * delta * 4;
                if (carSpeed < -maxSpeed/2) carSpeed = -maxSpeed/2;
            } else {
                // Friction
                carSpeed *= (1 - delta * 2.5);
                if (Math.abs(carSpeed) < 0.2) carSpeed = 0;
            }
            
            // Steering
            if (Math.abs(carSpeed) > 1) {
                let turn = (right ? -1 : (left ? 1 : 0)) * turnSpeed * (Math.abs(carSpeed) / maxSpeed) * delta * 15;
                steering += turn;
                steering = Math.min(Math.max(steering, -0.6), 0.6);
            } else {
                steering *= (1 - delta * 8);
            }
            
            // Apply steering to car angle
            carAngle += steering * delta * 12;
            carAngle = Math.min(Math.max(carAngle, -0.9), 0.9);
            
            // Update car rotation
            carGroup.rotation.y = carAngle;
            
            // Move car forward/backward based on speed
            const moveZ = carSpeed * delta * 3.5;
            let newZ = carGroup.position.z + moveZ;
            let newX = carGroup.position.x + (steering * 1.2 * delta * (Math.abs(carSpeed) / maxSpeed) * 2);
            
            // Boundaries
            newX = Math.min(Math.max(newX, leftBound), rightBound);
            
            // Infinite track wrap-around
            if (newZ > 18) {
                newZ = -18;
            }
            if (newZ < -22) {
                newZ = 18;
            }
            
            carGroup.position.x = newX;
            carGroup.position.z = newZ;
            
            // Tilt effect
            carGroup.rotation.x = steering * 0.3;
            carGroup.rotation.z = -steering * 0.2;
            
            // Update speedometer
            let displaySpeed = Math.abs(Math.floor(carSpeed * 8));
            speedElem.innerHTML = `${displaySpeed}<small>KM/H</small>`;
            
            // Update follow light
            followLight.position.set(carGroup.position.x, 2, carGroup.position.z - 2);
            
            // Update AI cars
            for (let ai of aiCars) {
                ai.z += ai.speed * delta * 2.5;
                if (ai.z > 20) {
                    ai.z = -25;
                    ai.mesh.position.z = ai.z;
                    // Randomize position x sedikit
                    ai.mesh.position.x = (Math.random() - 0.5) * 5;
                }
                if (ai.z < -30) {
                    ai.z = 20;
                    ai.mesh.position.z = ai.z;
                    ai.mesh.position.x = (Math.random() - 0.5) * 5;
                }
                ai.mesh.position.z = ai.z;
                
                // Simple AI steering
                const dx = carGroup.position.x - ai.mesh.position.x;
                if (Math.abs(dx) > 0.5) {
                    let steerDir = dx > 0 ? 1 : -1;
                    ai.mesh.position.x += steerDir * 0.03 * delta * 30;
                    ai.mesh.position.x = Math.min(Math.max(ai.mesh.position.x, leftBound), rightBound);
                }
                
                // Collision detection with AI
                const distX = Math.abs(carGroup.position.x - ai.mesh.position.x);
                const distZ = Math.abs(carGroup.position.z - ai.mesh.position.z);
                if (distX < 1.0 && distZ < 1.2) {
                    // Crash effect
                    carSpeed *= -0.3;
                    if (carSpeed > 0) carSpeed = -5;
                    // Bounce AI
                    ai.speed = 2;
                    // Flash effect (change body color temporarily)
                    body.material.emissiveIntensity = 0.8;
                    setTimeout(() => {
                        body.material.emissiveIntensity = 0.1;
                    }, 150);
                }
            }
            
            // Update camera target to follow car
            cameraTarget.lerp(new THREE.Vector3(carGroup.position.x, 0.5, carGroup.position.z), 0.05);
            controls.target.copy(cameraTarget);
            
            // Update orbit controls
            controls.update();
            
            // Animate stars
            stars.rotation.y += 0.0005;
            stars.rotation.x += 0.0003;
            
            // Car light pulse
            const pulse = 0.5 + Math.sin(Date.now() * 0.015) * 0.3;
            frontLight.material.emissiveIntensity = pulse;
            backLight.material.emissiveIntensity = pulse;
            
            // Render
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
            
            requestAnimationFrame(animate);
        }
        
        // Handle resize
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // Start game
        animate();
        
        // Console welcome
        console.log('%c🏁 3D RACING ACTIVATED - Use WASD or Arrow Keys + Mouse to look around! 🏁', 'color: cyan; font-size: 16px');
    </script>
</body>
</html>

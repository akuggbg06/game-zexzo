<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>RACING SIMPLE - Halow brow</title>
    <style>
        * {
            user-select: none;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(180deg, #0a0f1e 0%, #1a1a2e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
        }
        .game-container {
            background: #0a0a1a;
            padding: 15px;
            border-radius: 20px;
            border: 2px solid cyan;
            box-shadow: 0 0 20px rgba(0,255,255,0.3);
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 10px;
            background: #1a1a2a;
        }
        .info {
            text-align: center;
            margin-top: 10px;
            color: cyan;
            font-size: 14px;
        }
        .speed {
            text-align: center;
            color: yellow;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }
        button {
            background: linear-gradient(145deg, #1a1a2e, #0a0a1a);
            border: 1px solid cyan;
            color: cyan;
            font-size: 24px;
            font-weight: bold;
            padding: 10px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-family: monospace;
            box-shadow: 0 4px 0 #004466;
            transition: 0.03s linear;
        }
        button:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #004466;
        }
        .key-hint {
            text-align: center;
            margin-top: 10px;
            font-size: 10px;
            color: #888;
        }
        @media (max-width: 600px) {
            button { padding: 8px 20px; font-size: 20px; }
        }
    </style>
</head>
<body>
<div>
    <div class="game-container">
        <div class="speed">🏁 SPEED: <span id="speedVal">0</span> KM/H 🏁</div>
        <canvas id="gameCanvas" width="400" height="550"></canvas>
        <div class="controls">
            <button id="leftBtn">◀ KIRI</button>
            <button id="rightBtn">KANAN ▶</button>
        </div>
        <div class="key-hint">⌨️ LAPTOP: ← → atau A D | 📱 HP: TEKAN TOMBOL</div>
        <div class="info">🚗 Hindari Mobil Merah! Mobilmu maju otomatis 🚗</div>
    </div>
</div>

<script>
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = 400;
        canvas.height = 550;
        
        // PLAYER (mobil hijau)
        let playerX = canvas.width / 2 - 25;
        const playerWidth = 45;
        const playerHeight = 55;
        const playerY = canvas.height - 80;
        
        // MUSUH
        let enemies = [];
        
        let score = 0;
        let baseSpeed = 4;
        let gameRunning = true;
        let frameCount = 0;
        
        // Input (cuma kiri/kanan)
        let leftPressed = false;
        let rightPressed = false;
        
        // Spawn musuh
        function spawnEnemy() {
            const x = 20 + Math.random() * (canvas.width - 60);
            enemies.push({
                x: x,
                y: -60,
                width: 40,
                height: 50,
                color: '#ff4444'
            });
        }
        
        // Musuh awal (dikit biar ga rame)
        for(let i = 0; i < 3; i++) {
            spawnEnemy();
            enemies[i].y = -100 - i * 120;
        }
        
        function updateGame() {
            if(!gameRunning) return;
            
            // Kecepatan nambah dikit setiap saat
            baseSpeed += 0.003;
            if(baseSpeed > 9) baseSpeed = 9;
            
            let displaySpeed = Math.floor(baseSpeed * 12);
            document.getElementById('speedVal').innerText = displaySpeed;
            
            // Gerak kiri kanan player
            if(leftPressed && playerX > 10) {
                playerX -= 6;
            }
            if(rightPressed && playerX < canvas.width - playerWidth - 10) {
                playerX += 6;
            }
            
            // Update posisi musuh (turun)
            for(let i = 0; i < enemies.length; i++) {
                enemies[i].y += baseSpeed;
                
                if(enemies[i].y > canvas.height) {
                    enemies[i].y = -60;
                    enemies[i].x = 20 + Math.random() * (canvas.width - 60);
                    score++;
                }
            }
            
            // Spawn musuh baru pelan-pelan
            frameCount++;
            if(frameCount > 70 && enemies.length < 5) {
                spawnEnemy();
                frameCount = 0;
            }
            
            // COLLISION
            for(let i = 0; i < enemies.length; i++) {
                const e = enemies[i];
                if(playerX < e.x + e.width &&
                   playerX + playerWidth > e.x &&
                   playerY < e.y + e.height &&
                   playerY + playerHeight > e.y) {
                    gameRunning = false;
                    alert('💥 GAME OVER! 💥\nSkor: ' + score);
                    restartGame();
                    return;
                }
            }
        }
        
        function restartGame() {
            gameRunning = true;
            score = 0;
            baseSpeed = 4;
            playerX = canvas.width / 2 - 22;
            enemies = [];
            for(let i = 0; i < 3; i++) {
                spawnEnemy();
                enemies[i].y = -100 - i * 120;
            }
            document.getElementById('speedVal').innerText = '0';
        }
        
        function draw() {
            // Background
            ctx.fillStyle = '#1a1a2a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Garis tengah putus-putus
            ctx.beginPath();
            ctx.setLineDash([15, 25]);
            ctx.strokeStyle = '#ffff00';
            ctx.lineWidth = 3;
            for(let i = 0; i < 15; i++) {
                ctx.beginPath();
                ctx.moveTo(canvas.width/2, i * 45);
                ctx.lineTo(canvas.width/2, i * 45 + 25);
                ctx.stroke();
            }
            ctx.setLineDash([]);
            
            // Pinggir jalan
            ctx.strokeStyle = '#ffffff88';
            ctx.lineWidth = 2;
            ctx.strokeRect(8, 8, canvas.width - 16, canvas.height - 16);
            
            // GAMBAR MUSUH (mobil merah)
            for(let e of enemies) {
                ctx.fillStyle = e.color;
                ctx.shadowBlur = 6;
                ctx.shadowColor = 'red';
                ctx.fillRect(e.x, e.y, e.width, e.height);
                
                // Kaca
                ctx.fillStyle = '#333366';
                ctx.fillRect(e.x + 8, e.y + 8, e.width - 16, 12);
                
                // Lampu
                ctx.fillStyle = '#ffaa00';
                ctx.fillRect(e.x + 5, e.y + e.height - 8, 7, 5);
                ctx.fillRect(e.x + e.width - 12, e.y + e.height - 8, 7, 5);
                
                // Roda
                ctx.fillStyle = '#222';
                ctx.fillRect(e.x + 5, e.y + e.height - 10, 7, 7);
                ctx.fillRect(e.x + e.width - 12, e.y + e.height - 10, 7, 7);
                ctx.fillRect(e.x + 5, e.y + 3, 7, 7);
                ctx.fillRect(e.x + e.width - 12, e.y + 3, 7, 7);
            }
            
            // GAMBAR PLAYER (mobil hijau)
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#0ff';
            ctx.fillStyle = '#33ff88';
            ctx.fillRect(playerX, playerY, playerWidth, playerHeight);
            
            // Kaca
            ctx.fillStyle = '#88ccff';
            ctx.fillRect(playerX + 10, playerY + 8, playerWidth - 20, 12);
            
            // Lampu
            ctx.fillStyle = '#ffaa44';
            ctx.fillRect(playerX + 5, playerY + playerHeight - 8, 7, 5);
            ctx.fillRect(playerX + playerWidth - 12, playerY + playerHeight - 8, 7, 5);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(playerX + 5, playerY + 3, 6, 6);
            ctx.fillRect(playerX + playerWidth - 11, playerY + 3, 6, 6);
            
            // Roda
            ctx.fillStyle = '#111';
            ctx.fillRect(playerX + 5, playerY + playerHeight - 10, 7, 7);
            ctx.fillRect(playerX + playerWidth - 12, playerY + playerHeight - 10, 7, 7);
            ctx.fillRect(playerX + 5, playerY + 3, 7, 7);
            ctx.fillRect(playerX + playerWidth - 12, playerY + 3, 7, 7);
            
            ctx.shadowBlur = 0;
            
            // Skor
            ctx.font = "bold 18px monospace";
            ctx.fillStyle = "#0ff";
            ctx.fillText("SCORE: " + score, 15, 35);
        }
        
        // ============ INPUT ============
        // Keyboard
        window.addEventListener('keydown', (e) => {
            const key = e.key;
            if(key === 'ArrowLeft' || key === 'a' || key === 'A') leftPressed = true;
            if(key === 'ArrowRight' || key === 'd' || key === 'D') rightPressed = true;
            e.preventDefault();
        });
        window.addEventListener('keyup', (e) => {
            const key = e.key;
            if(key === 'ArrowLeft' || key === 'a' || key === 'A') leftPressed = false;
            if(key === 'ArrowRight' || key === 'd' || key === 'D') rightPressed = false;
        });
        
        // Tombol touch
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');
        
        leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); leftPressed = true; });
        leftBtn.addEventListener('touchend', () => { leftPressed = false; });
        leftBtn.addEventListener('mousedown', () => { leftPressed = true; });
        leftBtn.addEventListener('mouseup', () => { leftPressed = false; });
        
        rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); rightPressed = true; });
        rightBtn.addEventListener('touchend', () => { rightPressed = false; });
        rightBtn.addEventListener('mousedown', () => { rightPressed = true; });
        rightBtn.addEventListener('mouseup', () => { rightPressed = false; });
        
        // LOOP
        function gameLoop() {
            updateGame();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        gameLoop();
    })();
</script>
</body>
</html>
